<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="image">Hover over an image below to display here.</div>
  <div id="thumbnails">
    <img src="https://picsum.photos/seed/mountains/400/300" alt="Mountains" onmouseover="upDate(this)"onmouseout="undo()" />
    <img src="https://picsum.photos/seed/forest/400/300" alt="Forest" onmouseover="upDate(this)" onmouseout="undo()" />
    <img src="https://picsum.photos/seed/ocean/400/300" alt="Ocean" onmouseover="upDate(this)" onmouseout="undo()" />
    <img src="https://picsum.photos/seed/city/400/300" alt="City" onmouseover="upDate(this)" onmouseout="undo()" />
  </div>
  <script src="js/main.js"></script>
</body>
</html>
